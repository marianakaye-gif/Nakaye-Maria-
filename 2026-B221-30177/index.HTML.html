<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 540px;
            max-width: 95%;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: #eeeeeb;
            border-radius: 25px;
            box-shadow: 0 5px 20px #cccccc;
        }

        .display-area {
            flex: 1;
            min-width: 0;
        }

        .display {
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .result {
            color:#333333;
            font-size: 20px;
            padding: 10px 5px;
        }

        .buttons {
            width: 250px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 40px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            background-color: #f7f7f7;
            color: #333333;
            font-size: 16px;
            cursor: pointer;
        }

        .operator {
            background-color: #55bce9;
            border: none;
        }

        .clear {
            background-color: #eeeeee;
        }

        .equal {
            background-color: #55bce9;
            grid-column: span 2;
        }

        button:hover {
            background-color: #cccccc;
        }

        .operator:hover,
        .equal:hover {
            background-color: #299bd0;
        }

        @media (max-width: 520px) {
            .calculator {
                flex-direction: column;
                padding: 20px;
            }

            .display-area,
            .buttons {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="display-area">
            <div class="display"></div>
            <div class="result">0</div>
        </div>

        <div class="buttons">
            <button class="clear">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="operator">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>

    </div>

</body>
</html>
